<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武陵高中 115年重補修作業流程檢核</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }

        /* 自訂核取方塊動畫與樣式 */
        .checkbox-wrapper input:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .checkbox-wrapper input:checked + div svg {
            display: block;
        }
        
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-animate {
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [role, setRole] = useState(null);
            const [progress, setProgress] = useState({});
            
            // 行政登入密碼驗證相關狀態
            const [adminModalOpen, setAdminModalOpen] = useState(false);
            const [pwdInput, setPwdInput] = useState('');
            const [pwdError, setPwdError] = useState(false);

            // 讀取 LocalStorage 進度
            useEffect(() => {
                const savedRole = localStorage.getItem('wuling_makeup_role');
                const savedProgress = JSON.parse(localStorage.getItem('wuling_makeup_progress')) || {};
                if (savedRole) setRole(savedRole);
                setProgress(savedProgress);
            }, []);

            // 狀態切換與儲存
            const toggleTask = (taskId) => {
                const newProgress = { ...progress, [taskId]: !progress[taskId] };
                setProgress(newProgress);
                localStorage.setItem('wuling_makeup_progress', JSON.stringify(newProgress));
            };

            const handleLogin = (selectedRole) => {
                setRole(selectedRole);
                localStorage.setItem('wuling_makeup_role', selectedRole);
            };

            const handleLogout = () => {
                setRole(null);
                localStorage.removeItem('wuling_makeup_role');
            };

            // 處理角色選擇（攔截行政選項跳出密碼輸入框）
            const handleRoleSelect = (selectedRole) => {
                if (selectedRole === 'admin') {
                    setAdminModalOpen(true);
                    setPwdInput('');
                    setPwdError(false);
                } else {
                    handleLogin(selectedRole);
                }
            };

            // 驗證行政密碼
            const verifyAdmin = (e) => {
                e.preventDefault();
                /* 【前端簡易加密防護】
                   密碼：wlsh@270# 
                   加密邏輯：將字串反轉後轉為 Base64。
                   原始字串 -> 反轉為 "#072@hslw" -> Base64轉換為 "IzA3MkBoc2x3"
                   如此原始碼中就不會出現明文密碼，防止被檢視。
                */
                const cipher = btoa(pwdInput.split('').reverse().join(''));
                
                if (cipher === 'IzA3MkBoc2x3') {
                    setAdminModalOpen(false);
                    handleLogin('admin');
                } else {
                    setPwdError(true);
                    setPwdInput(''); // 錯誤時清空密碼
                }
            };

            // ========== 資料庫定義區 ==========
            const tasksData = {
                admin: [
                    {
                        phase: "前置作業與意願調查 (梯次99)",
                        icon: "fa-solid fa-bullhorn",
                        color: "blue",
                        items: [
                            { id: "a1", time: "4/09", task: "公告規範草案、發布教師意願調查", detail: "調查包含專班、分流、大班教學意願。", isCritical: false },
                            { id: "a2", time: "5/13", task: "啟動多管道公告", detail: "使用無聲廣播、LINE、校網，提醒 5/18 選課確認（意願登記）。", isCritical: false },
                            { id: "a3", time: "5/18 - 5/22", task: "監控「梯次 99 (選課確認)」進度", detail: "【系統檢核重點】注意系統需顯示「(意願登記)科目名稱」。", isCritical: true },
                            { id: "a4", time: "5/21", task: "高三補考日，監控成績結算狀態", detail: "確認系統成績是否順利寫入，準備判定開班。", isCritical: false },
                            { id: "a5", time: "5/22 14:00後", task: "判定開班型態", detail: "檢核：15人+為專班、6-14人為自學、5人以下不開班（除非影響畢業權益需填附件二）。", isCritical: true },
                            { id: "a6", time: "5/25", task: "公布選課確認結果與前置通知", detail: "【動作】通知出納組開通繳費系統帳號。提醒學生 5/27 開始正式報名。", isCritical: true },
                            { id: "a7", time: "5/26 - 5/27", task: "匯入名單與時間", detail: "【系統操作】匯入高三補考名單及教師授課時間。", isCritical: true }
                        ]
                    },
                    {
                        phase: "梯次 1 作業 (高三全、高一二上)",
                        icon: "fa-solid fa-1",
                        color: "orange",
                        items: [
                            { id: "a8", time: "6/02 14:00後", task: "執行梯次 1 結算", detail: "【動作】產出繳費單、匯出資料給註冊組、提醒 6/03 開始繳費。", isCritical: true },
                            { id: "a9", time: "6/08", task: "排定梯次 1 授課總表", detail: "公告至教師與科召群組以供預備。", isCritical: false },
                            { id: "a10", time: "6/09", task: "公告正式課表", detail: "包含授課時間與教室編排。", isCritical: false }, // ← 這裡補上逗號
                            { id: "a10_1", time: "6/10 & 6/13", task: "【自學輔導】首節線上 meeting 啟動", detail: "高三自學輔導線上meeting時間：6/10(三)；高一二上自學輔導：6/13(六)。※ 各科目具體開課時間請參閱校網公告。", isCritical: true }
                        ]
                    },
                    {
                        phase: "梯次 2 作業 (高一二下)",
                        icon: "fa-solid fa-2",
                        color: "emerald",
                        items: [
                            { id: "a11", time: "7/13", task: "高一二補考日", detail: "監控補考與成績產出進度。", isCritical: false },
                            { id: "a12", time: "7/14", task: "通知出納組", detail: "【動作】再次通知出納組開通梯次 2 繳費帳號。", isCritical: true },
                            { id: "a13", time: "7/15 - 7/16", task: "匯入補考名單", detail: "【系統操作】匯入高一二補考名單。", isCritical: true },
                            { id: "a14", time: "7/20 14:00後", task: "執行梯次 2 結算與拆班", detail: "【動作】產出繳費單、匯出資料給註冊組。", isCritical: true },
                            { id: "a15", time: "7/24", task: "排定梯次 2 授課總表", detail: "確認所有梯次二的授課規劃。(7/28前要公告)", isCritical: false },
                            { id: "a15_1", time: "8/01", task: "【自學輔導】首節線上 meeting 啟動", detail: "高一二下自學輔導線上meeting時間：8/01(六)。※ 各科目具體開課時間請參閱校網公告。", isCritical: true }
                        ]
                    },
                    {
                        phase: "後續收尾作業",
                        icon: "fa-solid fa-file-invoice-dollar",
                        color: "gray",
                        items: [
                            { id: "a16", time: "8月底", task: "判定「學期中自學班」", detail: "最終公告並更新至校網。", isCritical: false },
                            { id: "a17", time: "12月", task: "執行全年度經費核銷", detail: "結算授課鐘點費與相關費用。", isCritical: true }
                        ]
                    }
                ],
                teacher: [
                    {
                        phase: "行政協助與前置",
                        icon: "fa-solid fa-clipboard-user",
                        color: "blue",
                        items: [
                            { id: "t1", time: "4月-5月間", task: "配合調查與排定師資", detail: "依教務處與各科召集人規劃，協調排定授課教師與預計上課時段。", isCritical: false },
                            { id: "t2", time: "教務處公告分班後", task: "確認授課名單與點名單", detail: "成班後，教務處將提供老師點名表。", isCritical: false }
                        ]
                    },
                    {
                        phase: "授課與成績處理(梯次一)",
                        icon: "fa-solid fa-chalkboard",
                        color: "orange",
                        items: [
                            { id: "t3_1", time: "6/10(三)", task: "高三【自學輔導】線上 meeting", detail: "高三上下學期自學輔導第一節開課時間。※ 各科目時間請依校網公告為準。", isCritical: true },
                            { id: "t3_2", time: "6/13(六)", task: "高一二上【自學輔導】線上 meeting", detail: "高一二上學期自學輔導第一節開課時間。※ 各科目時間請依校網公告為準。", isCritical: true },
                            { id: "t3", time: "6/10 - 7/31", task: "梯次 1 正式授課與評量", detail: "依公告課表實施。專班採實體面授。請確實掌握學生出席狀況。", isCritical: true },
                            { id: "t4", time: "課程結束後 1 週內", task: "成績交至教務處", detail: "請將最後成績交給教務處幹事。", isCritical: true }
                        ]
                    },
                    {
                        phase: "授課與成績處理 (梯次二)",
                        icon: "fa-solid fa-chalkboard",
                        color: "emerald",
                        items: [
                            { id: "t4_1", time: "8/01(六)", task: "高一二下【自學輔導】線上 meeting", detail: "高一二下學期自學輔導第一節開課時間。※ 各科目時間請依校網公告為準。", isCritical: true },
                            { id: "t4", time: "8/01 - 8/30", task: "梯次 2 正式授課與評量", detail: "同梯次一規定辦理。", isCritical: true },
                            { id: "t5", time: "課程結束後 1 週內", task: "成績交至教務處", detail: "請將最後成績交給教務處幹事。", isCritical: true }
                        ]
                    }
                ],
                student: [
                    {
                        phase: "選課確認 (極重要前置)",
                        icon: "fa-solid fa-clipboard-list",
                        color: "blue",
                        items: [
                            { id: "s1", time: "5/18 09:00 - 5/22 23:59", task: "登入系統完成「梯次99」意願登記", detail: "此階段為意願調查，無論最後會不會報名，只要有可能重修該門課程就點選。[教務處會在整理完報名結果後公告選課確認結果。]", isCritical: true }
                        ]
                    },
                    {
                        phase: "梯次一 (高三全、高一二上)",
                        icon: "fa-solid fa-1",
                        color: "orange",
                        items: [
                            { id: "s2", time: "5/27 12:00 - 6/2 13:00", task: "正式報名選課", detail: "此階段的報名人數為決定是否成班的「唯一」依據。", isCritical: true },
                            { id: "s3", time: "6/3 12:00 - 6/6 13:00", task: "線上繳費", detail: "一經繳費且順利成班，概不退費；逾期未繳視同放棄。", isCritical: true },
                            { id: "s4", time: "6/9 起", task: "查看分班公告", detail: "留意校網公告的教室與課表。[重補修報名系統內的公告喔!]", isCritical: false },
                            { id: "s4_1", time: "6/10(三) & 6/13(六)", task: "參與【自學輔導】首節線上 meeting", detail: "報名自學輔導者必看：高三班為 6/10(三)；高一二上為 6/13(六)。※ 各科目具體上課時間請自行參閱校網公告！", isCritical: true },
                            { id: "s5", time: "6/10 - 7/31", task: "梯次一 上課", detail: "依規定出席，請注意請假與缺課扣考規定。", isCritical: false }
                        ]
                    },
                    {
                        phase: "梯次二 (高一二下)",
                        icon: "fa-solid fa-2",
                        color: "emerald",
                        items: [
                            { id: "s6", time: "7/16 12:00 - 7/19 13:00", task: "正式報名選課", detail: "高一二下學期課程報名時段。", isCritical: true },
                            { id: "s7", time: "7/21 12:00 - 7/23 13:00", task: "線上繳費", detail: "完成繳費後即確認資格。", isCritical: true },
                            { id: "s8", time: "7/28 17:00 起", task: "查看分班公告", detail: "留意校網最新公告。", isCritical: false },
                            { id: "s8_1", time: "8/01(六)", task: "參與【自學輔導】首節線上 meeting", detail: "報名自學輔導者必看：高一二下學期自學輔導線上meeting為 8/01(六)。※ 各科目具體上課時間請自行參閱校網公告！", isCritical: true },
                            { id: "s9", time: "8/01 - 8/30", task: "梯次二 上課", detail: "依規定出席上課。", isCritical: false }
                        ]
                    }
                ]
            };

            // 色系對應表
            const getColorClasses = (color) => {
                const map = {
                    blue: { bg: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-200' },
                    orange: { bg: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-200' },
                    emerald: { bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-200' },
                    gray: { bg: 'bg-gray-100', text: 'text-gray-800', border: 'border-gray-200' }
                };
                return map[color] || map.blue;
            };

            // 渲染登入畫面
            const renderLoginScreen = () => (
                <div className="min-h-screen flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border border-gray-100 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-emerald-400 to-orange-400"></div>
                        
                        <div className="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 mt-2">
                            <i className="fa-solid fa-school-circle-check text-4xl text-blue-600"></i>
                        </div>
                        <h1 className="text-2xl font-bold text-gray-800">武陵高中</h1>
                        <h2 className="text-lg font-semibold text-gray-600 mb-2">115年度 重補修作業</h2>
                        <p className="text-gray-400 mb-8 text-sm">流程自我檢核系統</p>
                        
                        <div className="space-y-4">
                            <button onClick={() => handleRoleSelect('admin')} className="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-300 text-gray-700 hover:bg-gray-50 hover:border-gray-400 py-3 px-4 rounded-xl font-bold transition-all group shadow-sm">
                                <i className="fa-solid fa-user-gear text-xl group-hover:scale-110 transition-transform text-gray-500"></i> 行政組長檢核 <i className="fa-solid fa-lock text-xs text-gray-300 ml-1"></i>
                            </button>
                            <button onClick={() => handleRoleSelect('teacher')} className="w-full flex items-center justify-center gap-3 bg-white border-2 border-emerald-300 text-emerald-700 hover:bg-emerald-50 hover:border-emerald-400 py-3 px-4 rounded-xl font-bold transition-all group shadow-sm">
                                <i className="fa-solid fa-chalkboard-user text-xl group-hover:scale-110 transition-transform text-emerald-500"></i> 授課教師檢核
                            </button>
                            <button onClick={() => handleRoleSelect('student')} className="w-full flex items-center justify-center gap-3 bg-white border-2 border-blue-300 text-blue-700 hover:bg-blue-50 hover:border-blue-400 py-3 px-4 rounded-xl font-bold transition-all group shadow-sm">
                                <i className="fa-solid fa-user-graduate text-xl group-hover:scale-110 transition-transform text-blue-500"></i> 學生報名檢核
                            </button>
                        </div>
                    </div>
                </div>
            );

            // 渲染主儀表板畫面
            const renderDashboard = () => {
                const roleData = tasksData[role];
                const totalTasks = roleData.reduce((sum, phase) => sum + phase.items.length, 0);
                const completedTasks = roleData.reduce((sum, phase) => sum + phase.items.filter(item => progress[item.id]).length, 0);
                const progressPercent = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

                const roleInfo = {
                    admin: { title: "行政組長", icon: "fa-user-gear", color: "gray" },
                    teacher: { title: "授課教師", icon: "fa-chalkboard-user", color: "emerald" },
                    student: { title: "學生報名", icon: "fa-user-graduate", color: "blue" }
                }[role];

                return (
                    <div className="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 pb-12">
                        {/* Header */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4">
                                <div className={`w-12 h-12 bg-${roleInfo.color}-100 rounded-xl flex items-center justify-center shadow-inner`}>
                                    <i className={`fa-solid ${roleInfo.icon} text-2xl text-${roleInfo.color}-600`}></i>
                                </div>
                                <div>
                                    <h1 className="text-xl sm:text-2xl font-bold text-gray-800">重補修檢核表 <span className={`text-${roleInfo.color}-600`}>{roleInfo.title}</span></h1>
                                    <p className="text-gray-500 text-sm mt-1">武陵高中 115年度</p>
                                </div>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
                                {/* 快速切換選單 */}
                                <div className="flex bg-gray-100 rounded-lg p-1 w-full sm:w-auto overflow-hidden">
                                    <button onClick={() => handleRoleSelect('admin')} className={`px-3 py-1.5 rounded-md text-sm font-bold transition-all ${role === 'admin' ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>行政</button>
                                    <button onClick={() => handleRoleSelect('teacher')} className={`px-3 py-1.5 rounded-md text-sm font-bold transition-all ${role === 'teacher' ? 'bg-white shadow text-emerald-700' : 'text-gray-500 hover:text-gray-700'}`}>教師</button>
                                    <button onClick={() => handleRoleSelect('student')} className={`px-3 py-1.5 rounded-md text-sm font-bold transition-all ${role === 'student' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>學生</button>
                                </div>
                                <button onClick={handleLogout} className="text-sm font-bold text-red-500 bg-red-50 hover:bg-red-100 transition-colors flex items-center gap-2 px-4 py-2 rounded-lg">
                                    <i className="fa-solid fa-power-off"></i> 登出
                                </button>
                            </div>
                        </div>

                        {/* 學生專屬警告區塊 */}
                        {role === 'student' && (
                            <div className="bg-orange-50 border-l-4 border-orange-500 p-5 rounded-r-xl shadow-sm mb-6 animate-fade-in">
                                <h3 className="font-bold text-orange-800 text-lg flex items-center gap-2 mb-3">
                                    <i className="fa-solid fa-triangle-exclamation animate-pulse"></i> 學生報名重要警示 (必讀)
                                </h3>
                                <div className="space-y-3 text-orange-900 text-sm bg-white/50 p-4 rounded-lg">
                                    <p className="flex items-start gap-2">
                                        <i className="fa-solid fa-ban text-red-500 mt-1"></i>
                                        <span><strong>梯次 99 選課確認：</strong>若漏掉 5/18-5/22 的「梯次 99 選課確認(意願登記)」，正式報名（梯次 1, 2）將會被系統完全鎖定，無法補救！</span>
                                    </p>
                                    <p className="flex items-start gap-2">
                                        <i className="fa-solid fa-eye text-blue-500 mt-1"></i>
                                        <span><strong>跨年級情境說明：</strong>高一生因下學期成績尚未結算，系統上完全看不到下學期科目；高二、高三生可看見以前一下和二下須重修的課程。</span>
                                    </p>
                                    <p className="flex items-start gap-2">
                                        <i className="fa-solid fa-life-ring text-emerald-500 mt-1"></i>
                                        <span><strong>補救特殊路徑：</strong>若您報名的科目人數最後確定是5 人(含)以下面臨「不開班」，且該科目<strong>影響您的畢業權益</strong>，請自行下載「附件二」提出特殊申請。</span>
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Progress Bar */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
                            <div className="flex justify-between items-end mb-3">
                                <span className="font-bold text-gray-700 flex items-center gap-2">
                                    <i className="fa-solid fa-bars-progress text-gray-400"></i> 整體進度
                                </span>
                                <div className="text-right">
                                    <span className={`text-3xl font-black ${progressPercent === 100 ? 'text-emerald-500' : 'text-blue-600'}`}>{progressPercent}%</span>
                                    <span className="text-gray-400 text-sm ml-2">({completedTasks}/{totalTasks})</span>
                                </div>
                            </div>
                            <div className="w-full bg-gray-100 rounded-full h-4 overflow-hidden shadow-inner">
                                <div 
                                    className={`h-4 rounded-full transition-all duration-700 ease-out flex items-center justify-end pr-2
                                        ${progressPercent === 100 ? 'bg-emerald-500' : 'bg-gradient-to-r from-blue-400 to-blue-600'}`}
                                    style={{ width: `${progressPercent}%` }}
                                >
                                    {progressPercent > 10 && <div className="w-1.5 h-1.5 bg-white/50 rounded-full"></div>}
                                </div>
                            </div>
                        </div>

                        {/* 任務列表清單 */}
                        <div className="space-y-6">
                            {roleData.map((phaseData, pIndex) => {
                                const colors = getColorClasses(phaseData.color);
                                return (
                                    <div key={pIndex} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                        <div className={`${colors.bg} px-5 sm:px-6 py-4 border-b ${colors.border} flex items-center gap-3`}>
                                            <div className={`w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm`}>
                                                <i className={`${phaseData.icon} ${colors.text}`}></i>
                                            </div>
                                            <h2 className={`text-lg font-extrabold ${colors.text}`}>{phaseData.phase}</h2>
                                        </div>
                                        <div className="divide-y divide-gray-100">
                                            {phaseData.items.map((item) => {
                                                const isChecked = progress[item.id];
                                                return (
                                                    <div key={item.id} 
                                                        className={`p-5 sm:p-6 flex flex-col sm:flex-row gap-4 sm:gap-6 transition-all duration-300 hover:bg-gray-50 
                                                            ${isChecked ? 'bg-gray-50' : ''}`}
                                                    >
                                                        <label className="checkbox-wrapper flex-shrink-0 flex items-start pt-1 cursor-pointer">
                                                            <input 
                                                                type="checkbox" 
                                                                className="peer sr-only"
                                                                checked={isChecked || false}
                                                                onChange={() => toggleTask(item.id)}
                                                            />
                                                            <div className={`w-8 h-8 rounded border-2 flex items-center justify-center transition-all shadow-sm
                                                                ${isChecked ? 'border-emerald-500 bg-emerald-500' : 'border-gray-300 bg-white hover:border-blue-400'}`}>
                                                                <svg className={`w-5 h-5 text-white ${isChecked ? 'block' : 'hidden'} pointer-events-none`} viewBox="0 0 20 20" fill="currentColor">
                                                                    <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                                                </svg>
                                                            </div>
                                                        </label>
                                                        <div className="flex-1">
                                                            <div className="flex flex-col sm:flex-row sm:items-center gap-2 mb-2">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    {item.isCritical && !isChecked && (
                                                                        <span className="bg-red-100 text-red-600 text-xs px-2 py-1 rounded font-bold flex items-center gap-1 shadow-sm">
                                                                            <i className="fa-solid fa-bolt"></i> 重點
                                                                        </span>
                                                                    )}
                                                                    <span className={`font-mono text-sm font-bold px-2 py-1 rounded 
                                                                        ${isChecked ? 'bg-gray-100 text-gray-400' : 'bg-blue-50 text-blue-700 border border-blue-100'}`}>
                                                                        <i className="fa-regular fa-clock mr-1"></i> {item.time}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                            <h3 className={`text-lg font-bold leading-tight mb-2 transition-colors
                                                                ${isChecked ? 'text-gray-400 line-through' : 'text-gray-800'}`}>
                                                                {item.task}
                                                            </h3>
                                                            {item.detail && (
                                                                <p className={`text-sm leading-relaxed 
                                                                    ${isChecked ? 'text-gray-400' : 'text-gray-600'}`}>
                                                                    {item.detail.split(/(【動作】|【系統操作】|【系統檢核重點】)/g).map((part, i) => {
                                                                        if (part === '【動作】') return <strong key={i} className={`px-1 rounded ${isChecked ? '' : 'bg-yellow-100 text-yellow-800'}`}>{part}</strong>;
                                                                        if (part === '【系統操作】') return <strong key={i} className={`px-1 rounded ${isChecked ? '' : 'bg-purple-100 text-purple-800'}`}>{part}</strong>;
                                                                        if (part === '【系統檢核重點】') return <strong key={i} className={`px-1 rounded ${isChecked ? '' : 'bg-red-100 text-red-800'}`}>{part}</strong>;
                                                                        return part;
                                                                    })}
                                                                </p>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        <div className="text-center text-gray-400 text-sm mt-10">
                            <p>武陵高中 教務處 | 系統設計：整合版自我檢核器</p>
                            <p className="mt-1 text-xs opacity-70">進度紀錄將自動儲存於此瀏覽器中</p>
                        </div>
                    </div>
                );
            };

            return (
                <>
                    {/* 主畫面切換 */}
                    {!role ? renderLoginScreen() : renderDashboard()}

                    {/* 行政密碼驗證 Modal */}
                    {adminModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 sm:p-8 w-full max-w-sm shadow-2xl relative modal-animate border border-gray-100">
                                <button 
                                    onClick={() => { setAdminModalOpen(false); setPwdError(false); setPwdInput(''); }} 
                                    className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors"
                                >
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                                
                                <div className="text-center mb-6 mt-2">
                                    <div className="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-200 shadow-inner">
                                        <i className="fa-solid fa-lock text-gray-700 text-2xl"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-gray-800">行政權限驗證</h3>
                                    <p className="text-gray-500 text-sm mt-2">請輸入管理員專屬密碼以登入檢核表</p>
                                </div>

                                <form onSubmit={verifyAdmin}>
                                    <div className="mb-4">
                                        <input 
                                            type="password" 
                                            value={pwdInput}
                                            onChange={(e) => {
                                                setPwdInput(e.target.value);
                                                if(pwdError) setPwdError(false);
                                            }}
                                            placeholder="請輸入密碼"
                                            className={`w-full px-4 py-3 rounded-xl border-2 text-center tracking-widest font-mono text-lg transition-all
                                                ${pwdError ? 'border-red-400 focus:ring-red-200 bg-red-50 text-red-700' : 'border-gray-200 focus:border-blue-400 focus:ring-4 focus:ring-blue-100'} 
                                                focus:outline-none`}
                                            autoFocus
                                        />
                                        {pwdError && (
                                            <p className="text-red-500 text-xs font-bold text-center mt-3 animate-bounce">
                                                <i className="fa-solid fa-circle-exclamation"></i> 密碼錯誤，請重新輸入
                                            </p>
                                        )}
                                    </div>
                                    
                                    <button 
                                        type="submit" 
                                        className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3.5 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2 mt-2"
                                    >
                                        驗證並登入 <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
